<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Distortion AR</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    video { display: none; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const gl     = canvas.getContext('webgl');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = innerWidth  * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── SHADERS ──
const vsSource = `
attribute vec2 a_position;
varying vec2 v_uv;
void main() {
  v_uv = a_position * 0.5 + 0.5;   // no vertical flip here
  gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

const fsSource = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_camera;
uniform vec2      u_joints[21];
uniform float     u_depth;   // motion

float segDist(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a;
  vec2 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}

// Soft thick band around hand outline
float handBorderMask(vec2 p) {
  float minD = 1.0;
  vec2 a; vec2 b;

  // thumb 1-2-3-4
  a = u_joints[1]; b = u_joints[2]; minD = min(minD, segDist(p,a,b));
  a = u_joints[2]; b = u_joints[3]; minD = min(minD, segDist(p,a,b));
  a = u_joints[3]; b = u_joints[4]; minD = min(minD, segDist(p,a,b));
  // index 5-6-7-8
  a = u_joints[5]; b = u_joints[6]; minD = min(minD, segDist(p,a,b));
  a = u_joints[6]; b = u_joints[7]; minD = min(minD, segDist(p,a,b));
  a = u_joints[7]; b = u_joints[8]; minD = min(minD, segDist(p,a,b));
  // middle 9-10-11-12
  a = u_joints[9];  b = u_joints[10]; minD = min(minD, segDist(p,a,b));
  a = u_joints[10]; b = u_joints[11]; minD = min(minD, segDist(p,a,b));
  a = u_joints[11]; b = u_joints[12]; minD = min(minD, segDist(p,a,b));
  // ring 13-14-15-16
  a = u_joints[13]; b = u_joints[14]; minD = min(minD, segDist(p,a,b));
  a = u_joints[14]; b = u_joints[15]; minD = min(minD, segDist(p,a,b));
  a = u_joints[15]; b = u_joints[16]; minD = min(minD, segDist(p,a,b));
  // pinky 17-18-19-20
  a = u_joints[17]; b = u_joints[18]; minD = min(minD, segDist(p,a,b));
  a = u_joints[18]; b = u_joints[19]; minD = min(minD, segDist(p,a,b));
  a = u_joints[19]; b = u_joints[20]; minD = min(minD, segDist(p,a,b));
  // palm edges 0-5 and 0-17
  a = u_joints[0]; b = u_joints[5];  minD = min(minD, segDist(p,a,b));
  a = u_joints[0]; b = u_joints[17]; minD = min(minD, segDist(p,a,b));

  float borderWidth = 0.06; // thicker rim
  float inner = smoothstep(borderWidth * 0.7, 0.0, minD);
  float outer = smoothstep(borderWidth, borderWidth * 0.7, minD);
  return inner * outer;
}

void main() {
  vec2 uv = v_uv;
  vec3 base = texture2D(u_camera, uv).rgb;

  if (u_depth <= 0.015) {
    gl_FragColor = vec4(base, 1.0);
    return;
  }

  float mask = handBorderMask(uv);
  if (mask <= 0.001) {
    gl_FragColor = vec4(base, 1.0);
    return;
  }

  // normal roughly perpendicular to palm
  vec2 wrist = u_joints[0];
  vec2 mid   = u_joints[9];
  vec2 normal = normalize(mid - wrist);
  normal = vec2(-normal.y, normal.x);

  float strength = mask * (0.035 + u_depth * 0.05);
  vec2 offset = normal * strength;
  offset = clamp(offset, vec2(-0.04), vec2(0.04));

  vec3 col;
  col.r = texture2D(u_camera, uv + offset * 1.01).r;
  col.g = texture2D(u_camera, uv + offset * 0.99).g;
  col.b = texture2D(u_camera, uv + offset * 0.97).b;

  col = mix(base, col, mask * (0.8 + u_depth * 0.5));
  col += vec3(mask * 0.25 * u_depth);

  gl_FragColor = vec4(col, 1.0);
}
`;

// ── COMPILE ──
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(program);
gl.useProgram(program);

// Fullscreen quad
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),
  gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Camera texture
const camTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, camTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const uCamera = gl.getUniformLocation(program, 'u_camera');
const uJoints = gl.getUniformLocation(program, 'u_joints');
const uDepth  = gl.getUniformLocation(program, 'u_depth');

// ── HAND TRACKING ──
let handLandmarks = new Array(21).fill(null).map(() => ({x:-1,y:-1}));
let prevLandmarks = null;
let depthValue    = 0.0;   // motion

const hands = new Hands({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});

hands.onResults((results) => {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];

    if (!prevLandmarks) prevLandmarks = lm;
    const alpha = 0.3;
    const smooth = [];
    for (let i = 0; i < lm.length; i++) {
      const p = prevLandmarks[i];
      const c = lm[i];
      smooth.push({
        x: p.x + (c.x - p.x) * alpha,
        y: p.y + (c.y - p.y) * alpha
      });
    }

    // motion = average per-joint delta
    let motion = 0.0;
    for (let i = 0; i < smooth.length; i++) {
      const p = prevLandmarks[i];
      const c = smooth[i];
      const dx = c.x - p.x;
      const dy = c.y - p.y;
      motion += Math.sqrt(dx*dx + dy*dy);
    }
    motion /= smooth.length;
    motion = Math.min(1.5, motion * 25.0);

    depthValue = motion;
    prevLandmarks = smooth;
    handLandmarks = smooth;
  } else {
    depthValue *= 0.8;
  }
});

// Start camera
const camera = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 1280,
  height: 720,
  facingMode: 'environment'
});
camera.start();

// ── RENDER ──
function render() {
  requestAnimationFrame(render);

  if (video.readyState >= 2) {
    gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA,
                  gl.UNSIGNED_BYTE, video);
  }

  const joints = new Float32Array(42);
  for (let i = 0; i < 21; i++) {
    const lm = handLandmarks[i] || {x:-1,y:-1};
    joints[i*2]   = lm.x;
    joints[i*2+1] = lm.y;   // no flip
  }

  gl.uniform1i(uCamera, 0);
  gl.uniform2fv(uJoints, joints);
  gl.uniform1f(uDepth, depthValue);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(render);
</script>
</body>
</html>
