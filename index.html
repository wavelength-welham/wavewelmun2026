<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Distortion AR – Water Wall</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    html,body{
      margin:0;padding:0;width:100%;height:100%;
      overflow:hidden;background:#000;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
      touch-action:none;-webkit-user-select:none;user-select:none;
    }
    #app{position:fixed;inset:0;overflow:hidden;background:#000;}
    video#camera{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;
      transform-origin:center center;
      background:#000;
    }
    canvas#glcanvas{
      position:absolute;inset:0;width:100%;height:100%;
      pointer-events:none;
    }
    #ui{position:absolute;inset:0;pointer-events:none;}
    #hint{
      position:absolute;left:50%;bottom:18%;
      transform:translateX(-50%);
      color:#fff;font-size:15px;
      padding:10px 16px;border-radius:999px;
      background:rgba(0,0,0,0.55);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      opacity:1;transition:opacity .6s ease;
      pointer-events:none;white-space:nowrap;
    }
    #hint.hidden{opacity:0;}
    #controls{
      position:absolute;right:12px;bottom:12px;
      display:flex;flex-direction:column;gap:8px;
      pointer-events:auto;
    }
    button{
      border:none;border-radius:999px;
      padding:10px 16px;
      background:rgba(0,0,0,0.55);color:#fff;
      font-size:14px;letter-spacing:0.03em;text-transform:uppercase;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    }
    #tapStart{
      position:absolute;inset:0;
      background:rgba(0,0,0,0.8);color:#fff;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;text-align:center;
      z-index:10;pointer-events:auto;
    }
    #tapStart button{margin-top:16px;background:#fff;color:#000;}
  </style>
</head>
<body>
  <div id="app">
    <video id="camera" playsinline muted></video>
    <canvas id="glcanvas"></canvas>

    <div id="ui">
      <div id="hint">Push the water wall with your hand</div>
      <div id="controls">
        <button id="flipBtn">Flip Camera</button>
      </div>
      <div id="tapStart">
        <div>Tap to enable camera &amp; audio</div>
        <button id="startBtn">Start</button>
      </div>
    </div>
  </div>

  <!-- Vertex shader -->
  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 a_position;
    varying vec2 v_uv;
    void main(){
      v_uv = a_position*0.5+0.5;
      gl_Position = vec4(a_position,0.0,1.0);
    }
  </script>

  <!-- Fragment shader: area-centric water wall -->
  <script id="fs" type="x-shader/x-fragment">
    precision highp float;
    varying vec2 v_uv;
    uniform sampler2D u_camera;
    uniform float u_time;
    uniform vec2  u_flow;       // global flow
    uniform float u_flowMag;    // 0..1
    uniform vec2  u_palm;       // palm center
    uniform float u_palmActive; // 1 if palm tracked

    vec3 sampleBlur(sampler2D tex, vec2 uv, vec2 dir, float blurAmount){
      vec3 col = vec3(0.0);
      float wSum = 0.0;
      for(int i=-3;i<=3;i++){
        float fi = float(i);
        float w  = 1.0 - abs(fi)/3.0;
        vec2 u   = uv + dir * blurAmount * fi;
        u = clamp(u,0.001,0.999);
        col += texture2D(tex,u).rgb * w;
        wSum += w;
      }
      return col / wSum;
    }

    void main(){
      // upright camera
      vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);

      // area-centric mask around palm
      float areaMask = 0.0;
      if (u_palmActive > 0.5) {
        float radius = 0.30;
        float d = distance(uv, u_palm);
        float x = clamp(d / radius, 0.0, 1.0);
        areaMask = 1.0 - smoothstep(0.5, 1.0, x); // strong near palm, fades out
      }

      // global flow direction
      vec2 dir = normalize(u_flow + vec2(0.0,0.00001));
      float m  = u_flowMag;

      // gentle ripples
      float wave = sin((uv.y + u_time*0.3)*40.0) * 0.003;
      float wave2= sin((uv.x*0.8 - u_time*0.25)*30.0) * 0.002;
      vec2 ripple = vec2(wave2, wave);

      // total offset, scaled by areaMask so only region near palm moves
      float baseMag = (0.02 + 0.06*m) * areaMask;
      vec2 offset = dir * baseMag + ripple * (0.4 + m) * areaMask;

      vec3 base = texture2D(u_camera, uv).rgb;

      // blur along flow dir for liquid feel, also area-masked
      float blurAmount = 0.4 * m * areaMask;
      vec3 refr = sampleBlur(u_camera, uv + offset, dir, blurAmount);

      float glassAmount = 0.55 * m * areaMask; // very transparent
      vec3 color = mix(base, refr, glassAmount);

      gl_FragColor = vec4(color,1.0);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
  (function(){
    const video      = document.getElementById('camera');
    const canvas     = document.getElementById('glcanvas');
    const flipBtn    = document.getElementById('flipBtn');
    const hint       = document.getElementById('hint');
    const tapOverlay = document.getElementById('tapStart');
    const startBtn   = document.getElementById('startBtn');

    let gl, program;
    let a_position,u_camera,u_time,u_flow,u_flowMag,u_palm,u_palmActive;
    let quadBuffer,cameraTexture;

    let facingMode = 'environment';
    let mirrorVideo = false;
    let streaming=false;

    let lastPalm = null;
    let flow = {x:0,y:0};
    let flowMag = 0;

    // simple audio (can be removed if you hate it)
    let audioCtx=null, gainNode=null;
    const noteScale = [220,247,262,294,330,392,440];
    let lastNoteTime=0;

    function initAudio(){
      if(audioCtx)return;
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      gainNode=audioCtx.createGain();
      gainNode.gain.value=0;
      gainNode.connect(audioCtx.destination);
    }

    function playNote(strength){
      if(!audioCtx)return;
      const now=audioCtx.currentTime;
      if(now-lastNoteTime<0.09)return;
      lastNoteTime=now;
      const osc=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      const idx=Math.floor(Math.random()*noteScale.length);
      const base=noteScale[idx];
      osc.type='triangle';
      osc.frequency.value=base+strength*160;
      osc.connect(g).connect(gainNode);
      g.gain.value=0;
      osc.start(now);
      g.gain.linearRampToValueAtTime(0.2*strength,now+0.03);
      g.gain.linearRampToValueAtTime(0.0,now+0.20);
      osc.stop(now+0.22);
    }

    function updateAudio(str){
      if(!audioCtx)return;
      const now=audioCtx.currentTime;
      gainNode.gain.linearRampToValueAtTime(0.4*str,now+0.05);
      if(str>0.2) playNote(str);
    }

    function initGL(){
      gl=canvas.getContext('webgl',{alpha:true,antialias:true});
      if(!gl){alert('WebGL not supported');return;}
      const vsSrc=document.getElementById('vs').textContent.trim();
      const fsSrc=document.getElementById('fs').textContent.trim();
      function compile(t,s){
        const sh=gl.createShader(t);
        gl.shaderSource(sh,s);gl.compileShader(sh);
        if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){
          console.error(gl.getShaderInfoLog(sh));
          throw new Error('shader error');
        }
        return sh;
      }
      const vs=compile(gl.VERTEX_SHADER,vsSrc);
      const fs=compile(gl.FRAGMENT_SHADER,fsSrc);
      program=gl.createProgram();
      gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
      if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
        console.error(gl.getProgramInfoLog(program));
        throw new Error('link error');
      }
      gl.useProgram(program);
      a_position    = gl.getAttribLocation(program,'a_position');
      u_camera      = gl.getUniformLocation(program,'u_camera');
      u_time        = gl.getUniformLocation(program,'u_time');
      u_flow        = gl.getUniformLocation(program,'u_flow');
      u_flowMag     = gl.getUniformLocation(program,'u_flowMag');
      u_palm        = gl.getUniformLocation(program,'u_palm');
      u_palmActive  = gl.getUniformLocation(program,'u_palmActive');

      quadBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER,quadBuffer);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
      gl.enableVertexAttribArray(a_position);
      gl.vertexAttribPointer(a_position,2,gl.FLOAT,false,0,0);

      cameraTexture=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,cameraTexture);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.uniform1i(u_camera,0);

      resize();
      window.addEventListener('resize',resize);
    }
    function resize(){
      const dpr=window.devicePixelRatio||1;
      const w=canvas.clientWidth*dpr,h=canvas.clientHeight*dpr;
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
      gl.viewport(0,0,canvas.width,canvas.height);
    }

    let hands=null, mpCamera=null;

    async function startCameraAndHands(){
      hands=new Hands({
        locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands:MAX_HANDS,
        modelComplexity:1,
        minDetectionConfidence:0.6,
        minTrackingConfidence:0.6
      });
      hands.onResults(onHandsResults);

      mpCamera=new Camera(video,{
        onFrame:async()=>{ await hands.send({image:video}); },
        width:1280,height:720,facingMode:facingMode
      });
      await mpCamera.start();
      streaming=true;

      mirrorVideo = (facingMode === 'user');
      applyVideoTransform();
    }

    function applyVideoTransform(){
      let t='';
      if(mirrorVideo) t+='scaleX(-1) ';
      video.style.transform=t||'none';
    }

    flipBtn.addEventListener('click',()=>{
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      if(mpCamera){ mpCamera.stop(); mpCamera=null; }
      startCameraAndHands();
    });

    let firstHand=false;
    function onHandsResults(results){
      const lmList = results.multiHandLandmarks || [];
      const lm = lmList[0];
      if(lm){
        const p0 = lm[0], p9 = lm[9];
        let x = (p0.x + p9.x) * 0.5;
        let y = (p0.y + p9.y) * 0.5;
        if(mirrorVideo) x = 1-x;

        if(lastPalm){
          const dx = x - lastPalm.x;
          const dy = y - lastPalm.y;
          flow.x = flow.x*0.86 + dx*2.0;
          flow.y = flow.y*0.86 + dy*2.0;
          const len = Math.sqrt(flow.x*flow.x + flow.y*flow.y);
          flowMag = Math.min(1.0, len*4.0);
        }
        lastPalm = {x,y};

        if(!firstHand){
          firstHand=true;
          hint.classList.add('hidden');
        }
      } else {
        flow.x *= 0.92;
        flow.y *= 0.92;
        flowMag *= 0.9;
        lastPalm = null;
      }
    }

    let startTime=null;
    function render(nowMs){
      requestAnimationFrame(render);
      if(!gl||!streaming)return;
      if(!startTime){startTime=nowMs;}
      const t =(nowMs-startTime)/1000;

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D,cameraTexture);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);

      gl.clearColor(0,0,0,0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER,quadBuffer);
      gl.enableVertexAttribArray(a_position);
      gl.vertexAttribPointer(a_position,2,gl.FLOAT,false,0,0);

      gl.uniform1f(u_time,t);
      gl.uniform2f(u_flow,flow.x,flow.y);
      gl.uniform1f(u_flowMag,flowMag);

      if(lastPalm){
        gl.uniform2f(u_palm,lastPalm.x,1.0-lastPalm.y);
        gl.uniform1f(u_palmActive,1.0);
      }else{
        gl.uniform1f(u_palmActive,0.0);
      }

      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

      updateAudio(flowMag);
    }

    function startExperience(){
      if(tapOverlay.style.display==='none')return;
      tapOverlay.style.display='none';
      initAudio();
      initGL();
      startCameraAndHands();
      requestAnimationFrame(render);
    }

    startBtn.addEventListener('click',startExperience);
    tapOverlay.addEventListener('click',startExperience);
    document.body.addEventListener('click',()=>{startExperience();},{once:true});
  })();
  </script>
</body>
</html>
