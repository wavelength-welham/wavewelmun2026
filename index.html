<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Distortion AR</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    video {
      display: none;
    }
  </style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const gl     = canvas.getContext('webgl');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = innerWidth  * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── SHADERS ──
const vsSource = `
attribute vec2 a_position;
varying vec2 v_uv;
void main() {
  v_uv = a_position * 0.5 + 0.5;
  v_uv.y = 1.0 - v_uv.y;
  gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

const fsSource = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_camera;
uniform vec2      u_joints[21];
uniform float     u_depth;   // now = motion amount

float smoothCircle(vec2 p, vec2 center, float radius) {
  float d = length(p - center);
  return smoothstep(radius, radius * 0.6, d);
}

void main() {
  vec2 uv = v_uv;

  // If motion is tiny, just show camera (no distortion)
  if (u_depth <= 0.02) {
    gl_FragColor = texture2D(u_camera, uv);
    return;
  }

  // Wrist (0) and palm center (9)
  vec2 c0 = u_joints[0];
  vec2 c1 = u_joints[9];
  vec2 center = mix(c0, c1, 0.6);

  float baseRadius = 0.18;
  float radius = baseRadius * (0.7 + u_depth * 0.5);
  float mask  = smoothCircle(uv, center, radius);

  vec2 dir   = normalize(uv - center + 1e-6);
  float amt  = (1.0 - mask) * (0.03 + u_depth * 0.04);
  vec2 offset = dir * amt;

  // Mild RGB split
  vec3 col;
  col.r = texture2D(u_camera, uv + offset * 1.02).r;
  col.g = texture2D(u_camera, uv + offset * 0.99).g;
  col.b = texture2D(u_camera, uv + offset * 0.96).b;

  // Brighten inside the portal based on motion
  col *= 1.0 + (1.0 - mask) * (0.2 + u_depth * 0.4);

  float edge = smoothstep(radius * 0.9, radius, length(uv - center));
  col += vec3(edge * 0.2 * u_depth);

  gl_FragColor = vec4(col, 1.0);
}
`;

// ── COMPILE ──
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(program);
gl.useProgram(program);

// Fullscreen quad
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),
  gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Camera texture
const camTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, camTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const uCamera = gl.getUniformLocation(program, 'u_camera');
const uJoints = gl.getUniformLocation(program, 'u_joints');
const uDepth  = gl.getUniformLocation(program, 'u_depth');

// ── HAND TRACKING ──
let handLandmarks = new Array(21).fill(null).map(() => ({x:-1,y:-1}));
let prevLandmarks = null;
let depthValue    = 0.0;   // here = motion

const hands = new Hands({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});

hands.onResults((results) => {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];

    // smoothing
    if (!prevLandmarks) prevLandmarks = lm;
    const alpha = 0.3;
    const smooth = [];
    for (let i = 0; i < lm.length; i++) {
      const p = prevLandmarks[i];
      const c = lm[i];
      smooth.push({
        x: p.x + (c.x - p.x) * alpha,
        y: p.y + (c.y - p.y) * alpha
      });
    }

    // motion (average per-joint delta)
    let motion = 0.0;
    for (let i = 0; i < smooth.length; i++) {
      const p = prevLandmarks[i];
      const c = smooth[i];
      const dx = c.x - p.x;
      const dy = c.y - p.y;
      motion += Math.sqrt(dx*dx + dy*dy);
    }
    motion = motion / smooth.length;
    motion = Math.min(1.5, motion * 25.0); // gain

    depthValue = motion;        // drive shader with motion
    prevLandmarks = smooth;
    handLandmarks = smooth;
  } else {
    // When no hand, let motion quickly decay to zero
    depthValue *= 0.8;
  }
});

// Start camera
const camera = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 1280,
  height: 720,
  facingMode: 'environment'
});
camera.start();

// ── RENDER ──
function render() {
  requestAnimationFrame(render);

  if (video.readyState >= 2) {
    gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA,
                  gl.UNSIGNED_BYTE, video);
  }

  const joints = new Float32Array(42);
  for (let i = 0; i < 21; i++) {
    const lm = handLandmarks[i] || {x:-1,y:-1};
    joints[i*2]   = lm.x;
    joints[i*2+1] = 1.0 - lm.y;
  }

  gl.uniform1i(uCamera, 0);
  gl.uniform2fv(uJoints, joints);
  gl.uniform1f(uDepth, depthValue);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(render);
</script>
</body>
</html>
